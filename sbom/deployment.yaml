apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine
  namespace: alpine
  labels:
    run: alpine
spec:
  replicas: 1
  selector:
    matchLabels:
      run: alpine
  template:
    metadata:
      labels:
        run: alpine
    spec:
      containers:
        - name: alpine-a
          image: 1pro/alpine:3.20.0
          args:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
        - name: alpine-b
          image: 1pro/alpine:3.19.1
          args:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
        - name: alpine-c
          image: 1pro/alpine:3.16.9
          args:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
